name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH key and config
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          mkdir -p ~/.ssh
          if [ -z "$SSH_PRIVATE_KEY_B64" ]; then
            echo "Missing secret: SSH_PRIVATE_KEY_B64"
            exit 1
          fi
          printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n' | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat >> ~/.ssh/config << 'EOF'
          Host ghaction-ssh.lcmarques.work
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            User lcm
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF

      - name: Deploy via SSH
        run: |
          ssh lcm@ghaction-ssh.lcmarques.work << 'ENDSSH'
            cd /home/lcm/sites/lcm-track/lcm_track

            echo "Pulling latest code..."
            git pull origin main

            echo "Building and starting containers..."
            docker compose -f docker-compose.prod.yml up --build -d

            echo "Running migrations..."
            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force

            echo "Clearing caches..."
            docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
            docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache

            echo "Deploy done!"
          ENDSSH
