services:
  frontend:
    build:
      context: ./lcm-frontend
      args:
        BUILD_CONFIGURATION: development
    ports:
      - "8080:80"
    depends_on:
      - backend

  backend:
    build: ./lcm-backend
    ports:
      - "8000:80"
    depends_on:
      - db

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_DATABASE: lcm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: lcm_user
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: