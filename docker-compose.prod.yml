services:
  frontend:
    build:
      context: ./lcm-frontend
      args:
        BUILD_CONFIGURATION: production
    ports:
      - "8002:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./lcm-backend
    ports:
      - "8003:80"
    restart: unless-stopped
    env_file:
      - ./lcm-backend/.env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - ./lcm-backend/.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lcm}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-lcm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
