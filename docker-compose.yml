services:
  frontend:
    build:
      context: ./lcm-frontend
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -lc "[ -d node_modules ] || npm install; npm run start -- --host 0.0.0.0 --port 4200 --poll 2000"
    ports:
      - "4200:4200"
    volumes:
      - ./lcm-frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build: ./lcm-backend
    working_dir: /var/www/html
    command: sh -lc "[ -d vendor ] || composer install --no-interaction --prefer-dist; apache2-foreground"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: lcm
      DB_USERNAME: lcm_user
      DB_PASSWORD: secret
    ports:
      - "8000:80"
    volumes:
      - ./lcm-backend:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: lcm
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: lcm_user
      MYSQL_PASSWORD: secret
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./.docker/mysql:/var/lib/mysql

volumes:
  frontend_node_modules: