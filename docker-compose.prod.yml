services:
  frontend:
    build:
      context: ./lcm-frontend
      args:
        BUILD_CONFIGURATION: production
    ports:
      - "8002:80"
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    build: ./lcm-backend
    ports:
      - "8003:80"
    restart: unless-stopped
    env_file:
      - ./lcm-backend/.env
    depends_on:
      - db

  db:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - ./lcm-backend/.env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lcm}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-lcm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
