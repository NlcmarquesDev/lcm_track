name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH key and config
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY_B64" ]; then
            printf '%s' "$SSH_PRIVATE_KEY_B64" | tr -d '\r\n' | base64 -d > ~/.ssh/id_ed25519
          elif [ -n "$SSH_PRIVATE_KEY" ]; then
            printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            echo "Missing secret: set SSH_PRIVATE_KEY_B64 or SSH_PRIVATE_KEY"
            exit 1
          fi
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat >> ~/.ssh/config << 'EOF'
          Host ghaction-ssh.lcmarques.work
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            User lcm
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
          EOF

      - name: Deploy via SSH
        run: |
          ssh lcm@ghaction-ssh.lcmarques.work <<'ENDSSH'
          set -euo pipefail

          cd /home/lcm/sites/lcm-track/lcm_track

          echo "Pulling latest code..."
          git pull origin main

          echo "Writing backend .env..."
          cat > lcm-backend/.env <<'BACKEND_ENV_EOF'
          ${{ secrets.BACKEND_ENV }}
          BACKEND_ENV_EOF

          echo "Checking port 8002..."
          PORT_8002_CONTAINERS=$(docker ps --format '{{.ID}} {{.Ports}}' | awk '$0 ~ /0\.0\.0\.0:8002->/ {print $1}')
          if [ -n "$PORT_8002_CONTAINERS" ]; then
            echo "Stopping container(s) using port 8002: $PORT_8002_CONTAINERS"
            docker stop $PORT_8002_CONTAINERS || true
            docker rm $PORT_8002_CONTAINERS || true
          else
            echo "Port 8002 is free."
          fi

          echo "Building and starting containers..."
          docker compose -f docker-compose.prod.yml up --build -d --remove-orphans

          echo "Waiting for database to be ready..."
          for i in $(seq 1 30); do
            if docker compose -f docker-compose.prod.yml exec -T db sh -lc 'mysqladmin ping -h localhost -uroot -p"$MYSQL_ROOT_PASSWORD" --silent' >/dev/null 2>&1; then
              echo "Database is ready."
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Database did not become ready in time."
              exit 1
            fi
            sleep 3
          done

          echo "Running migrations..."
          docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force

          echo "Clearing caches..."
          docker compose -f docker-compose.prod.yml exec -T backend php artisan config:cache
          docker compose -f docker-compose.prod.yml exec -T backend php artisan route:cache

          echo "Deploy done!!"
          ENDSSH
